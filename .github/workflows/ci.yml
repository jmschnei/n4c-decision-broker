name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[server,dev]"
      - name: Test (offline, no Ollama needed)
        run: python -m pytest -q
      - name: CLI smoke test
        run: n4c-decision-broker demo --no-cache --audit-log /tmp/audit.jsonl

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t n4c-decision-broker .
      - name: Refuses to start without API keys
        run: |
          if docker run --rm n4c-decision-broker; then echo "should have failed"; exit 1; fi
      - name: Starts and serves health
        run: |
          docker run -d --name b -p 8787:8787 -e N4C_BROKER_API_KEYS=ci n4c-decision-broker
          for i in $(seq 1 15); do curl -fs localhost:8787/v1/broker/health && exit 0; sleep 1; done
          docker logs b; exit 1
